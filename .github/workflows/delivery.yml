name: Delivery

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint, type checks, tests, and build
        run: pnpm check

  publish:
    name: Publish ${{ matrix.name }} image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: realtime
            dockerfile: apps/realtime/Dockerfile
          - name: migrate
            dockerfile: packages/db/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/dandan1232/collabdocs-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/dandan1232/collabdocs-${{ matrix.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ secrets.COLLABDOCS_BASE_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/collabdocs' }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      COLLABDOCS_BASE_URL: ${{ secrets.COLLABDOCS_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DEPLOY_HOST
            DEPLOY_USER
            DEPLOY_SSH_KEY
            DEPLOY_KNOWN_HOSTS
            GHCR_USERNAME
            GHCR_READ_TOKEN
            COLLABDOCS_BASE_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment manifests
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$remote" \
            "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/scripts'"
          scp -P "$DEPLOY_PORT" docker-compose.yml \
            "$remote:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$DEPLOY_PORT" deploy/docker-compose.ghcr.yml \
            "$remote:$DEPLOY_PATH/deploy/docker-compose.ghcr.yml"
          scp -P "$DEPLOY_PORT" scripts/deploy-production.sh \
            "$remote:$DEPLOY_PATH/scripts/deploy-production.sh"
          ssh -p "$DEPLOY_PORT" "$remote" \
            "chmod 700 '$DEPLOY_PATH/scripts/deploy-production.sh'"

      - name: Authenticate server to GHCR
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -p "$DEPLOY_PORT" "$remote" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          if ! ssh -p "$DEPLOY_PORT" "$remote" \
            "cd '$DEPLOY_PATH' && ./scripts/deploy-production.sh deploy '${GITHUB_SHA}'"; then
            ssh -p "$DEPLOY_PORT" "$remote" \
              "cd '$DEPLOY_PATH' && ./scripts/deploy-production.sh rollback" || true
            exit 1
          fi

      - name: Verify production and roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          if ! node scripts/smoke-production.mjs "$COLLABDOCS_BASE_URL"; then
            ssh -p "$DEPLOY_PORT" "$remote" \
              "cd '$DEPLOY_PATH' && ./scripts/deploy-production.sh rollback"
            exit 1
          fi

      - name: Clean up superseded server images and legacy archives
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -p "$DEPLOY_PORT" "$remote" \
            "cd '$DEPLOY_PATH' && ./scripts/deploy-production.sh cleanup"
