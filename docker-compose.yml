name: collabdocs

services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabdocs}
      POSTGRES_DB: ${POSTGRES_DB:-collabdocs}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-collabdocs} -d ${POSTGRES_DB:-collabdocs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-collabdocs}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-collabdocs-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-collabdocs} ${MINIO_ROOT_PASSWORD:-collabdocs-local-secret};
      mc mb --ignore-existing local/${S3_BUCKET:-collabdocs};
      exit 0;
      "

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-collabdocs}:${POSTGRES_PASSWORD:-collabdocs}@postgres:5432/${POSTGRES_DB:-collabdocs}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-collabdocs}:${POSTGRES_PASSWORD:-collabdocs}@postgres:5432/${POSTGRES_DB:-collabdocs}?schema=public
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:${REALTIME_PORT:-1234}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-collabdocs}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-collabdocs}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-collabdocs-local-secret}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    environment:
      NODE_ENV: production
      REALTIME_PORT: 1234
      DATABASE_URL: postgresql://${POSTGRES_USER:-collabdocs}:${POSTGRES_PASSWORD:-collabdocs}@postgres:5432/${POSTGRES_DB:-collabdocs}?schema=public
    ports:
      - "${REALTIME_PORT:-1234}:1234"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://localhost:1234/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
